<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>The Pond</title>
<style>
  :root { --water:#cfeee9; --deep:#2f6f6a; --bubble:#ffffff; --me:#ffe7a8; --ink:#1f2d2b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--water);
         color:var(--ink); height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--deep); color:#fff; padding:12px 16px; font-size:1.4rem; font-weight:700; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; gap:10px; align-items:flex-end; max-width:720px; }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .face { font-size:2.4rem; line-height:1; }
  .bubble { background:var(--bubble); padding:12px 16px; border-radius:18px; font-size:1.25rem;
            line-height:1.4; white-space:pre-wrap; box-shadow:0 1px 2px #0002; }
  .me .bubble { background:var(--me); }
  .who { font-size:.85rem; opacity:.7; margin-bottom:4px; }
  form { display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; }
  input { flex:1; font-size:1.3rem; padding:12px 14px; border:2px solid var(--deep); border-radius:14px; min-width:0; }
  button { font-size:1.3rem; padding:12px 20px; border:0; border-radius:14px; background:var(--deep); color:#fff; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>🌿 The Pond</header>
<main id="chat" aria-live="polite"></main>
<form id="f">
  <input id="t" autocomplete="off" maxlength="500" placeholder="Say something…" aria-label="Your message">
  <button id="b">Send</button>
</form>
<script>
  const ANIMALS = __ANIMALS__;
  const FACES = { turtle: "🐢", capybara: "🦫", hedgehog: "🦔" };
  const key = new URLSearchParams(location.search).get("key") || "";
  const animal = ANIMALS[0];
  const chat = document.getElementById("chat");

  function add(who, text, face, mine) {
    const row = document.createElement("div");
    row.className = "row" + (mine ? " me" : "");
    const f = document.createElement("div"); f.className = "face"; f.textContent = face;
    const wrap = document.createElement("div");
    const name = document.createElement("div"); name.className = "who"; name.textContent = who;
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
    wrap.append(name, b); row.append(f, wrap); chat.append(row);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  const face = FACES[animal.id] || "🐾";
  add(animal.name, "Hello there!", face);

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("t"), btn = document.getElementById("b");
    const text = input.value.trim();
    if (!text) return;
    add("You", text, "🙂", true);
    input.value = ""; btn.disabled = true;
    const waiting = add(animal.name, "…", face);
    try {
      const r = await fetch("/talk", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Pond-Key": key },
        body: JSON.stringify({ animal: animal.id, text }),
      });
      const data = await r.json().catch(() => ({}));
      waiting.textContent = data.reply || data.error || "The pond is a bit sleepy. Try again in a moment.";
    } catch {
      waiting.textContent = "The pond is a bit sleepy. Try again in a moment.";
    }
    btn.disabled = false; input.focus();
  });
</script>
</body>
</html>
